# The pilot on the linear max-of-2 network (models/max2: the two tokens' one-hot vectors summed, then three
# linear maps) at 64 tokens and hidden width 8: 4,096 inputs, 1,088 weights, brute force 2,683,968.
# At this size a copy of the weights cannot fit a checker: written out they measure at least 34,044 units
# against the Lean service's description budget of 12,544.
#   proof rounds on  max2-v64-s0  (4,095 of 4,096 inputs correct)
#   seed check on    max2-v64-s1  (4,092 of 4,096 inputs correct), the same sizes, another seed
# Everything else is config/pilot/base.yaml.
extends: base.yaml
run_id: pilot-linear-max2
model: models/max2
networks: [max2-v64-s0]
open_lane:
  seed_check: {network: max2-v64-s1}

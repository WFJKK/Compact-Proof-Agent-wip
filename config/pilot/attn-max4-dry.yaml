# For the dry start of attn-max4-ptl-1 alone, never a run: that run's settings, with a probe module given to start
# from, so that the dry start has something to compile, run and submit on attn-max4-v64-s0 before any agent
# works on it:
#
#     python3 -m core.open_lane.dry_start --config config/pilot/attn-max4-dry.yaml --sandbox seatbelt --check
#
# The probe (config/pilot/start/attn-max4-probe/Probe.lean) is the general single rule on the 64 inputs whose
# first three tokens are 0, with its soundness proof. READY means: the Lean service exports the network,
# compiles a module against it, checks the soundness theorem, runs the compiled checker on the network and on
# its eight copies, and scores it. On the cloud machine (23 November 2026): the first compile, which builds
# the network's module, 113 s; the nine runs 8 s (a bill of 842,176: 64 forward passes of 13,159); accepted
# and scored in 14 s, 58 of the 64 inputs certified.
# The run itself (attn-max4-ptl-1.yaml) starts from nothing: it is never given this module.
extends: attn-max4-ptl-1.yaml
run_id: attn-max4-dry
open_lane:
  start_drafts:
    - path: Candidate/Probe.lean
      with: config/pilot/start/attn-max4-probe/Probe.lean
      note: >-
        A probe for the dry start: the general single rule on the inputs whose first three tokens are 0, with
        its soundness proof.
      scored: {checker: Candidate.Probe.D, sound: Candidate.Probe.D_sound, certificate: []}
